<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPro — Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">⬡</span>
        <span>ExamPro</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item active" data-page="dashboard">
          <span class="nav-icon">▦</span> Dashboard
        </a>
        <a href="exams.html" class="nav-item" data-page="exams">
          <span class="nav-icon">📋</span> Exams
        </a>
        <a href="questions.html" class="nav-item" data-page="questions">
          <span class="nav-icon">❓</span> Questions
        </a>
        <a href="students.html" class="nav-item" data-page="students">
          <span class="nav-icon">👥</span> Students
        </a>
        <a href="results.html" class="nav-item" data-page="results">
          <span class="nav-icon">📊</span> Results
        </a>
        <a href="settings.html" class="nav-item" data-page="settings">
          <span class="nav-icon">⚙</span> Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="avatar">A</div>
          <div>
            <div class="user-name">Admin</div>
            <div class="user-role">Administrator</div>
          </div>
        </div>
        <button class="btn-logout" onclick="logout()">⏻ Logout</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-content">
      <header class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <h2 class="page-title">Dashboard</h2>
        <div class="topbar-right">
          <span class="badge-time" id="clock"></span>
        </div>
      </header>

      <div class="content-body">
        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card accent-blue">
            <div class="stat-icon">📋</div>
            <div class="stat-info">
              <div class="stat-value" id="totalExams">0</div>
              <div class="stat-label">Total Exams</div>
            </div>
          </div>
          <div class="stat-card accent-green">
            <div class="stat-icon">👥</div>
            <div class="stat-info">
              <div class="stat-value" id="totalStudents">0</div>
              <div class="stat-label">Students</div>
            </div>
          </div>
          <div class="stat-card accent-orange">
            <div class="stat-icon">❓</div>
            <div class="stat-info">
              <div class="stat-value" id="totalQuestions">0</div>
              <div class="stat-label">Questions</div>
            </div>
          </div>
          <div class="stat-card accent-purple">
            <div class="stat-icon">📊</div>
            <div class="stat-info">
              <div class="stat-value" id="totalResults">0</div>
              <div class="stat-label">Results</div>
            </div>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="dashboard-grid">
          <div class="card">
            <div class="card-header">
              <h3>Recent Exams</h3>
              <a href="exams.html" class="link-more">View all →</a>
            </div>
            <table class="data-table">
              <thead>
                <tr><th>Exam Name</th><th>Subject</th><th>Duration</th><th>Status</th></tr>
              </thead>
              <tbody id="recentExamsTbl">
                <tr><td colspan="4" class="empty-row">No exams yet</td></tr>
              </tbody>
            </table>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>Recent Results</h3>
              <a href="results.html" class="link-more">View all →</a>
            </div>
            <table class="data-table">
              <thead>
                <tr><th>Student</th><th>Exam</th><th>Score</th><th>Grade</th></tr>
              </thead>
              <tbody id="recentResultsTbl">
                <tr><td colspan="4" class="empty-row">No results yet</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
