<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ExamPro — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body class="login-page">
  <div class="login-bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <div class="login-container">
    <div class="login-brand">
      <div class="brand-icon">⬡</div>
      <h1>ExamPro</h1>
      <p>Online Examination System</p>
    </div>

    <div class="login-card">
      <h2>Welcome Back</h2>
      <p class="login-sub">Sign in to your account to continue</p>

      <div id="loginError" class="alert alert-error hidden">
        ⚠ Invalid username or password.
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" autocomplete="off"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Enter password"/>
          <button class="pw-toggle" onclick="togglePw()">👁</button>
        </div>
      </div>

      <button class="btn-primary btn-full" onclick="doLogin()">Sign In</button>

      <div class="login-hint">
        <small>Demo: <strong>admin</strong> / <strong>admin123</strong></small>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
